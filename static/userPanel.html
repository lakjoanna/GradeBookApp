<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/userPanel.js"></script>
    <link rel="stylesheet" href="/css/index.css"/>
    <link rel="stylesheet" href="/css/userPanel.css"/>
    <title>Panel Użytkownika</title>
</head>
<body>
    <nav class="nav">
        <h2 class="student-name" id="studentName"></h2>
        <button class="btn-primary" id="btnLogOut">Wyloguj</button>
    </nav>
    <div class="main-container">
        <div class="content">
            <h1 class="form-caption">Panel Użytkownika</h1>

            <!-- Tabela z przedmiotami i po kliknięciu w wiersz danego przedmiotu przekieruje nas na stronę z ocenami i szczegółami odnośnie tego przedmiotu -->
            <h2>Przedmioty</h2>
            <table class="datatable">
                <thead>
                    <tr>
                        <th>Lp</th>
                        <th>Nazwa</th>
                    </tr>
                </thead>
                <tbody id="coursesTBody">


                </tbody>
             </table>

             <h2>Uwagi</h2>
             <table class="datatable">
                <thead>
                    <th>Tytuł</th>
                    <th>Treść</th>
                </thead>
                <tbody id="commentsTBody">
    
                </tbody>
            </table>

        </div>
    </div>
</body>
</html>
